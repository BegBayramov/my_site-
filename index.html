<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bildirişler — GurbatTM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gd: #0a3d2e; --gm: #1a6b4a; --gp: #e1f5ee; --gm2: #c8e8dc;
    --gold: #c8a84b; --gold-l: #fdf3dc;
    --cream: #faf8f3; --white: #fff;
    --t: #111d17; --t2: #4a6358; --t3: #8aa89a;
    --b: #e2ece7; --sh: rgba(26,107,74,0.07);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'IBM Plex Sans', sans-serif; background: var(--cream); color: var(--t); }

  nav {
    position: sticky; top: 0; z-index: 200;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 48px; height: 64px;
    background: rgba(10,61,46,0.97); backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(200,168,75,0.2);
  }
  .nav-logo { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; color: #fff; text-decoration: none; }
  .nav-logo span { color: var(--gold); }
  .nav-links { display: flex; gap: 28px; }
  .nav-links a { font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.65); text-decoration: none; transition: color .2s; }
  .nav-links a:hover, .nav-links a.active { color: var(--gold); }
  .btn-add { padding: 8px 18px; border-radius: 6px; background: var(--gold); color: var(--gd); font-size: 13px; font-weight: 700; border: none; cursor: pointer; font-family: inherit; }

  /* PAGE HEADER */
  .ph { background: var(--gd); padding: 40px 48px 0; }
  .ph-inner { max-width: 1100px; margin: 0 auto; }
  .bc { display: flex; gap: 8px; font-size: 12px; color: rgba(255,255,255,0.4); margin-bottom: 14px; }
  .bc a { color: rgba(255,255,255,0.4); text-decoration: none; }
  .ph-title { font-family: 'Playfair Display', serif; font-size: 34px; font-weight: 700; color: #fff; margin-bottom: 4px; }
  .ph-title em { color: var(--gold); font-style: normal; }
  .ph-sub { font-size: 13px; color: rgba(255,255,255,0.5); margin-bottom: 24px; }
  .fb { display: flex; gap: 8px; flex-wrap: wrap; padding: 16px 0 0; border-top: 1px solid rgba(255,255,255,0.08); }
  .fsel { padding: 9px 12px; border-radius: 8px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); color: rgba(255,255,255,0.9); font-size: 13px; font-weight: 500; font-family: inherit; cursor: pointer; outline: none; }
  .fsel option { background: #0a3d2e; }
  .fsearch { flex: 1; min-width: 160px; padding: 9px 14px; border-radius: 8px; background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.12); color: #fff; font-size: 13px; font-family: inherit; outline: none; }
  .fsearch::placeholder { color: rgba(255,255,255,0.3); }

  .tabs { background: var(--gd); border-bottom: 1px solid rgba(255,255,255,0.08); }
  .tabs-inner { max-width: 1100px; margin: 0 auto; padding: 0 48px; display: flex; }
  .tab { padding: 13px 18px; font-size: 13px; font-weight: 500; color: rgba(255,255,255,0.45); cursor: pointer; border-bottom: 2px solid transparent; transition: all .2s; white-space: nowrap; user-select: none; }
  .tab:hover { color: rgba(255,255,255,0.8); }
  .tab.active { color: var(--gold); border-bottom-color: var(--gold); }

  .main { max-width: 1100px; margin: 0 auto; padding: 32px 48px 80px; display: grid; grid-template-columns: 1fr 288px; gap: 24px; align-items: start; }
  .listings { display: flex; flex-direction: column; gap: 12px; }
  .res-info { font-size: 13px; color: var(--t2); margin-bottom: 6px; }
  .res-info strong { color: var(--t); }

  /* CARD */
  .card { background: #fff; border: 1px solid var(--b); border-radius: 16px; overflow: hidden; transition: all .2s; cursor: pointer; }
  .card:hover { box-shadow: 0 8px 32px var(--sh); transform: translateY(-2px); border-color: var(--gm2); }
  .card.hidden { display: none; }

  .ct { padding: 16px 20px 14px; display: flex; align-items: flex-start; gap: 12px; }
  .cav { width: 46px; height: 46px; border-radius: 50%; background: var(--gp); font-size: 20px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .ci { flex: 1; min-width: 0; }
  .cn { font-size: 15px; font-weight: 600; color: var(--t); }
  .cm { font-size: 12px; color: var(--t3); margin-top: 2px; display: flex; align-items: center; gap: 6px; }
  .cr { text-align: right; flex-shrink: 0; }
  .cvbadge { display: inline-flex; align-items: center; gap: 3px; font-size: 10px; padding: 3px 9px; border-radius: 20px; background: #eaf3de; color: #3b6d11; font-weight: 600; }

  /* CATEGORY BAND */
  .cband { padding: 10px 20px; background: var(--gd); display: flex; align-items: center; justify-content: space-between; }
  .cband-left { display: flex; align-items: center; gap: 8px; }
  .cband-icon { font-size: 18px; }
  .cband-cat { font-size: 13px; font-weight: 600; color: #fff; }
  .cband-loc { font-size: 12px; color: rgba(255,255,255,0.55); display: flex; align-items: center; gap: 5px; }

  /* DESCRIPTION */
  .cdesc { padding: 12px 20px; border-top: 1px solid var(--b); font-size: 13px; color: var(--t2); line-height: 1.6; }

  /* DETAILS ROW */
  .cdetails { padding: 11px 20px; display: flex; gap: 0; border-top: 1px solid var(--b); }
  .di { flex: 1; padding-right: 12px; border-right: 1px solid var(--b); }
  .di:first-child { padding-left: 0; }
  .di:last-child { border-right: none; }
  .dlbl { font-size: 10px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--t3); margin-bottom: 3px; }
  .dval { font-size: 13px; font-weight: 500; color: var(--t); }

  /* FOOTER */
  .cfoot { padding: 12px 20px; border-top: 1px solid var(--b); display: flex; justify-content: space-between; align-items: center; }
  .cdate { font-size: 11px; color: var(--t3); }
  .cbtns { display: flex; gap: 7px; }
  .btn-msg { padding: 8px 14px; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; border: 1px solid var(--b); background: #fff; color: var(--t); transition: all .15s; }
  .btn-msg:hover { background: var(--gp); border-color: var(--gm2); }
  .btn-call { padding: 8px 14px; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; border: none; background: var(--gm); color: #fff; transition: background .15s; }
  .btn-call:hover { background: var(--gd); }

  /* CAT TAG */
  .ctag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 3px 9px; border-radius: 20px; font-weight: 500; }
  .ctag-blue   { background: #e6f1fb; color: #185fa5; }
  .ctag-green  { background: var(--gp); color: var(--gm); }
  .ctag-amber  { background: #faeeda; color: #854f0b; }
  .ctag-coral  { background: #faece7; color: #993c1d; }
  .ctag-purple { background: #eeedfe; color: #534ab7; }

  /* SIDEBAR */
  .sidebar { display: flex; flex-direction: column; gap: 14px; position: sticky; top: 80px; }
  .sc { background: #fff; border: 1px solid var(--b); border-radius: 16px; overflow: hidden; }
  .sh { padding: 14px 16px 12px; border-bottom: 1px solid var(--b); font-size: 13px; font-weight: 600; color: var(--t); }
  .sb { padding: 12px 16px; }
  .srow { display: flex; justify-content: space-between; align-items: center; padding: 7px 0; border-bottom: 1px solid var(--b); }
  .srow:last-child { border-bottom: none; }
  .slbl { font-size: 12px; color: var(--t2); }
  .sval { font-size: 13px; font-weight: 600; color: var(--t); }
  .sval.g { color: var(--gm); }
  .cat-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--b); cursor: pointer; }
  .cat-row:last-child { border-bottom: none; }
  .cat-row:hover .cat-n { color: var(--gm); }
  .cat-n { font-size: 13px; font-weight: 500; color: var(--t); }
  .cat-c { font-size: 11px; padding: 2px 8px; border-radius: 20px; background: var(--gp); color: var(--gm); font-weight: 600; }

  .post-cta { background: var(--gd); border-radius: 16px; padding: 20px 16px; text-align: center; }
  .cta-ico { font-size: 28px; margin-bottom: 8px; }
  .cta-title { font-family: 'Playfair Display', serif; font-size: 17px; color: #fff; margin-bottom: 6px; }
  .cta-sub { font-size: 12px; color: rgba(255,255,255,0.5); line-height: 1.5; margin-bottom: 14px; }
  .cta-btn { width: 100%; padding: 10px; border-radius: 8px; background: var(--gold); color: var(--gd); font-size: 13px; font-weight: 700; border: none; cursor: pointer; font-family: inherit; }

  /* EMPTY */
  .empty { display: block; text-align: center; padding: 56px 20px; background: #fff; border: 1px solid var(--b); border-radius: 16px; }
  .empty-ico { font-size: 36px; margin-bottom: 12px; }
  .empty-title { font-size: 15px; font-weight: 600; margin-bottom: 6px; }
  .empty-sub { font-size: 13px; color: var(--t2); }

  /* MODAL */
  .moverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 500; align-items: flex-start; justify-content: center; padding: 40px 20px; overflow-y: auto; }
  .moverlay.open { display: flex; }
  .mbox { background: #fff; border-radius: 20px; width: 100%; max-width: 520px; font-family: inherit; margin: auto; }
  .mhead { background: var(--gd); padding: 20px 24px 16px; border-radius: 20px 20px 0 0; display: flex; justify-content: space-between; align-items: center; }
  .mhead-title { font-family: 'Playfair Display', serif; font-size: 21px; font-weight: 700; color: #fff; }
  .mhead-title span { color: var(--gold); }
  .mhead-sub { font-size: 12px; color: rgba(255,255,255,0.45); margin-top: 2px; }
  .mclose { background: rgba(255,255,255,0.1); border: none; color: #fff; width: 32px; height: 32px; border-radius: 50%; font-size: 20px; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .mbody { padding: 22px 24px; display: flex; flex-direction: column; gap: 14px; }
  .msep { height: 1px; background: var(--b); margin: 2px 0; }
  .msec-title { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); }
  .frow { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .fgroup { display: flex; flex-direction: column; gap: 5px; }
  .fgroup.full { grid-column: 1 / -1; }
  .flabel { font-size: 12px; font-weight: 600; color: var(--t2); letter-spacing: .04em; }
  .flabel span { color: #e24b4a; }
  .finput, .fselect2, .ftextarea {
    width: 100%; padding: 10px 13px; border-radius: 9px;
    border: 1.5px solid var(--b); font-size: 14px;
    font-family: inherit; color: var(--t); outline: none;
    background: #fff; transition: border-color .2s;
  }
  .finput:focus, .fselect2:focus, .ftextarea:focus { border-color: var(--gm); }
  .ftextarea { resize: vertical; min-height: 90px; line-height: 1.6; }
  .fselect2 { cursor: pointer; }
  .msubmit { width: 100%; padding: 13px; border-radius: 10px; background: var(--gm); color: #fff; font-size: 15px; font-weight: 700; border: none; cursor: pointer; font-family: inherit; transition: background .2s; margin-top: 4px; }
  .msubmit:hover { background: var(--gd); }
  .mnote { font-size: 11px; color: var(--t3); text-align: center; }

  /* SUCCESS */
  .soverlay { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 600; align-items: center; justify-content: center; padding: 20px; }
  .soverlay.open { display: flex; }
  .sbox { background: #fff; border-radius: 20px; padding: 44px 32px; text-align: center; max-width: 360px; width: 100%; }
  .sico { font-size: 50px; margin-bottom: 14px; }
  .stitle { font-family: 'Playfair Display', serif; font-size: 26px; color: var(--gm); margin-bottom: 8px; }
  .ssub { font-size: 13px; color: var(--t2); line-height: 1.6; margin-bottom: 22px; }
  .sbtn { padding: 11px 26px; border-radius: 9px; background: var(--gm); color: #fff; font-size: 14px; font-weight: 600; border: none; cursor: pointer; font-family: inherit; }

  @media (max-width: 860px) {
    nav { padding: 0 16px; }
    .nav-links { display: none; }
    .ph { padding: 28px 20px 0; }
    .tabs-inner { padding: 0 20px; overflow-x: auto; }
    .main { grid-template-columns: 1fr; padding: 24px 20px 60px; }
    .sidebar { position: static; }
    .frow { grid-template-columns: 1fr; }
  }

  /* MESSENGER PICKER */
  .messenger-wrap { display: flex; flex-direction: column; gap: 6px; }
  .msg-btns { display: flex; gap: 6px; }
  .msg-btn {
    display: flex; align-items: center; gap: 5px;
    padding: 6px 10px; border-radius: 8px;
    border: 1.5px solid var(--b); background: #fff;
    font-size: 12px; font-weight: 600; color: var(--t2);
    cursor: pointer; transition: all .15s; font-family: inherit;
    white-space: nowrap;
  }
  .msg-btn:hover { border-color: var(--gm2); background: var(--gp); color: var(--gm); }
  .msg-btn.active { border-color: var(--gm); background: var(--gp); color: var(--gm); }
  /* CARD MESSENGER BADGE */
  .cmsg { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; padding: 2px 8px; border-radius: 20px; background: var(--gp); color: var(--gm); font-weight: 500; margin-top: 3px; }
  @keyframes fadeIn { from { opacity:0; transform:translateY(12px); } to { opacity:1; transform:translateY(0); } }

  .lang-btn { padding:5px 10px; border-radius:6px; font-size:12px; font-weight:600; border:1px solid rgba(255,255,255,0.2); background:transparent; color:rgba(255,255,255,0.6); cursor:pointer; font-family:inherit; transition:all .2s; }
  .lang-btn.active { background:var(--gold); color:var(--gd); border-color:var(--gold); }

  .photo-upload-wrap { display:flex; flex-direction:column; gap:8px; }
  .photo-upload-label {
    display:flex; align-items:center; justify-content:center; gap:8px;
    padding:28px 16px; border-radius:10px;
    border:2px dashed var(--b); background:var(--gp);
    cursor:pointer; transition:all .2s; color:var(--gm);
    font-size:13px; font-weight:600;
  }
  .photo-upload-label:hover { border-color:var(--gm); background:#d0f0e2; }
  .photo-upload-label input { display:none; }
  .photo-preview-grid { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; }
  .photo-thumb { position:relative; border-radius:8px; overflow:hidden; aspect-ratio:1; background:var(--b); }
  .photo-thumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .photo-thumb-del {
    position:absolute; top:3px; right:3px;
    width:20px; height:20px; border-radius:50%;
    background:rgba(0,0,0,0.6); color:#fff;
    border:none; cursor:pointer; font-size:12px;
    display:flex; align-items:center; justify-content:center; line-height:1;
  }
  .card-photos { display:grid; grid-template-columns:repeat(3,1fr); gap:6px; padding:10px 16px; border-top:1px solid var(--b); }
  .card-photos img { width:100%; aspect-ratio:1; object-fit:cover; border-radius:8px; cursor:pointer; transition:opacity .15s; }
  .card-photos img:hover { opacity:.85; }
  .card-photo-single { padding:0; }
  .card-photo-single img { width:100%; max-height:220px; object-fit:cover; border-radius:0; }

  @media (max-width: 900px) {
    .hero-inner, .filters-row, .tabs-inner, .main { padding-left: 16px !important; padding-right: 16px !important; }
    .main { grid-template-columns: 1fr; gap: 16px; padding-top: 16px; }
    .filters-row { grid-template-columns: 1fr 1fr; gap: 10px; }
    .fsearch { grid-column: 1 / -1; }
    .tabs-inner { overflow-x: auto; }
    .tab { padding: 12px 14px; font-size: 13px; }
    .ct, .cband, .cfoot { padding-left: 14px; padding-right: 14px; }
    .ct { gap: 10px; }
    .cdetails { grid-template-columns: 1fr 1fr; padding: 12px 14px; }
    .btn-call { min-height: 44px; padding: 10px 14px; }
    .mbox { width: min(100vw - 16px, 720px); max-height: 92vh; border-radius: 18px; }
    .frow { grid-template-columns: 1fr; }
  }
  @media (max-width: 560px) {
    .filters-row { grid-template-columns: 1fr; }
    .hero-inner { gap: 12px; }
    .htitle { font-size: 28px; }
    .ct { flex-wrap: wrap; }
    .cr { width: 100%; text-align: left; }
    .cdetails { grid-template-columns: 1fr; }
    .cbtns { width: 100%; }
    .btn-call { width: 100%; }
    .card-photos { grid-template-columns: repeat(2, 1fr); }
  }

</style>
</head>
<body>

<nav>
  <a class="nav-logo" href="index.html">Gurbat<span>TM</span></a>
  <div class="nav-links">
    <a href="#" class="active" id="nav-listings">Bildirişler</a>
    
  </div>
  <div style="display:flex;gap:4px;margin-right:8px;">
    <button class="lang-btn active" id="btn-ru" onclick="setLang('ru')">RU</button>
    <button class="lang-btn" id="btn-tm" onclick="setLang('tm')">TM</button>
  </div>
  <button class="btn-add" onclick="openModal()">+ Goşmak</button>
</nav>

<div class="ph">
  <div class="ph-inner">
    <div class="bc"><span style="color:rgba(255,255,255,0.7)">Bildirişler</span></div>
    <div class="ph-title" id="ph-title"><em>Bildirişler</em></div>
    <div class="ph-sub" id="ph-sub">Hyzmatlar, kömek, satuw · <span id="found-count">0</span> bildiriş</div>
    <div class="fb">
      <select class="fsel" id="f-cat" onchange="applyFilters()">
        <option value="">Ähli kategoriýalar</option>
        <option value="perevod">💸 Pul geçirme</option>
        <option value="pomosh">🤝 Hyzmatlar</option>
        <option value="prodaja">🛍️ Satuw</option>
        <option value="rabota">💼 Iş</option>
        <option value="zhilye">🏠 Ýaşaýyş</option>
        <option value="avto">🚗 Awtoulag</option>
      </select>
      <select class="fsel" id="f-country" onchange="applyFilters()">
        <option value="">Ähli ýurtlar</option>
        <option value="RO">🇷🇴 Rumyniýa</option>
        <option value="DE">🇩🇪 Germaniýa</option>
        <option value="PL">🇵🇱 Polşa</option>
        <option value="TR">🇹🇷 Türkiýe</option>
        <option value="RU">🇷🇺 Rossiýa</option>
        <option value="US">🇺🇸 ABŞ</option>
        <option value="AE">🇦🇪 BAE</option>
        <option value="TM">🇹🇲 Türkmenistan</option>
      </select>
      <select class="fsel" id="f-sort" onchange="applyFilters()">
        <option value="new">Ilki täzeler</option>
        <option value="old">Ilki köneler</option>
      </select>
      <input class="fsearch" type="text" id="f-search" placeholder="🔍 Gözleg..." oninput="applyFilters()">
    </div>
  </div>
</div>

<div class="tabs">
  <div class="tabs-inner">
    <div class="tab active" data-tab="all" id="tab-all">Ählisi</div>
    <div class="tab" data-tab="perevod" id="tab-perevod">💸 Geçirmeler</div>
    <div class="tab" data-tab="pomosh" id="tab-pomosh">🤝 Hyzmatlar</div>
    <div class="tab" data-tab="prodaja" id="tab-prodaja">🛍️ Satuw</div>
    <div class="tab" data-tab="rabota" id="tab-rabota">💼 Iş</div>
    <div class="tab" data-tab="zhilye" id="tab-zhilye">🏠 Ýaşaýyş</div>
  </div>
</div>

<div class="main">
  <div>
    <div class="res-info"><strong id="res-num">0</strong> bildiriş tapyldy</div>
    <div class="listings" id="listings">

      <div class="empty" id="empty">
        <div class="empty-ico">📢</div>
        <div class="empty-title">Bildiriş ýok</div>
        <div class="empty-sub">Ilkinji bol! Mugt bildiriş goy</div>
        <button class="btn-call" style="margin-top:16px;padding:10px 24px;border-radius:8px;" onclick="openModal()">+ Bildiriş goş</button>
      </div>

    </div>
  </div>

  <!-- SIDEBAR -->
  
    
  

<!-- MODAL -->
<div class="moverlay" id="moverlay">
  <div class="mbox">
    <div class="mhead">
      <div>
        <div class="mhead-title">Bildiriş <span>goş</span></div>
      </div>
      <button class="mclose" onclick="closeModal()">×</button>
    </div>
    <div class="mbody">

      <div class="msec-title">Seniň hakda</div>
      <div class="frow">
        <div class="fgroup">
          <label class="flabel">Ady we familiýasy <span>*</span></label>
          <input class="finput" type="text" id="m-name" placeholder="Murat Annayew">
        </div>
        <div class="fgroup">
          <label class="flabel">Telefon belgisi <span>*</span></label>
          <input class="finput" type="tel" id="m-phone" placeholder="+40 712 345 678">
        </div>
      </div>
      <div class="frow">
        <div class="fgroup">
          <label class="flabel">Habarlaşmak üçin</label>
          <div class="messenger-wrap">

function applyFilters() {
  const cat     = document.getElementById('f-cat').value;
  const country = document.getElementById('f-country').value;
  const q       = document.getElementById('f-search').value.toLowerCase().trim();
  const sort    = document.getElementById('f-sort')?.value || 'new';
  const wrap    = document.getElementById('listings');
  const cards   = Array.from(document.querySelectorAll('.card[data-cat]'));

  cards.forEach(card => {
    const matchCat     = !cat || card.dataset.cat === cat;
    const matchCountry = !country || card.dataset.country === country;
    const textContent  = (card.innerText || card.textContent || '').toLowerCase();
    const matchQ       = !q || (card.dataset.name || '').includes(q) || textContent.includes(q);
    const matchTab     = activeTab === 'all' || card.dataset.cat === activeTab;

    card.classList.toggle('hidden', !(matchCat && matchCountry && matchQ && matchTab));
  });

  cards
    .sort((a, b) => {
      const ad = Number(a.dataset.ts || a.dataset.date || 0);
      const bd = Number(b.dataset.ts || b.dataset.date || 0);
      return sort === 'old' ? ad - bd : bd - ad;
    })
    .forEach(card => wrap.appendChild(card));

  updateEmpty();
}

function getTimeLabel(date) {
  const now  = new Date();
  const diff = Math.floor((now - date) / 1000);

  if (diff < 60) return 'ýaňyja';
  if (diff < 3600) return Math.floor(diff / 60) + ' minut öň';
  if (diff < 86400) return Math.floor(diff / 3600) + ' sagat öň';

  return date.toLocaleDateString('ru-RU', { day:'numeric', month:'long' });
}

  const rows = await loadFromSupabase();
  const wrap = document.getElementById('listings');
  rows.forEach(r => {
    const flag = COUNTRY_FLAGS[r.country] || '🌍';
    const icon = categoryToIcon(r.category);
    const catKey = normalizeCategory(r.category);
    const initial = (r.name||'?').charAt(0).toUpperCase();
    const photos = [r.photo_1,r.photo_2,r.photo_3].filter(Boolean);
    const photoHtml = photos.length === 1
      ? `<div class="card-photos card-photo-single"><img src="${photos[0]}"></div>`
      : photos.length > 1
      ? `<div class="card-photos">${photos.map(p=>`<img src="${p}">`).join('')}</div>`
      : '';
    const msgBadge = r.messenger_val
      ? `<span class="cmsg">💬 ${r.messenger_app}: ${r.messenger_val}</span>` : '';
    const ts = r.created_at ? new Date(r.created_at).getTime() : 0;

    wrap.insertAdjacentHTML('beforeend', `
      <div class="card" data-cat="${catKey}" data-country="${r.country||''}" data-name="${(r.name||'').toLowerCase()} ${(r.title||'').toLowerCase()} ${(r.description||'').toLowerCase()} ${(r.city||'').toLowerCase()}" data-date="${ts}" data-ts="${ts}" data-phone="${r.phone||''}">
        <div class="ct">
          <div class="cav" style="background:${getAvatarColor(r.name||'A')}">${initial}</div>
          <div class="ci">
            <div class="cn">${r.name || ''}</div>
            <div class="cm">${flag} ${r.city || ''} · <span style="color:var(--t3)">${r.phone || ''}</span></div>
            ${msgBadge}
          </div>
          <div class="cr"><div class="cvbadge">✓ Barlandy</div></div>
        </div>
        <div class="cband">
          <div class="cband-left"><span class="cband-icon">${icon}</span><span class="cband-cat">${r.title || ''}</span></div>
          <div class="cband-loc">${flag} ${r.city || ''}</div>
        </div>
        <div class="cdesc">${r.description || ''}</div>
        ${photoHtml}
        <div class="cdetails">
          ${r.price ? `<div class="di"><div class="dlbl">Baha</div><div class="dval" style="color:var(--gm)">${r.price}</div></div>` : ''}
          <div class="di"><div class="dlbl">Ýurt</div><div class="dval">${flag} ${r.city || ''}</div></div>
          <div class="di"><div class="dlbl">Aragatnaşyk</div><div class="dval">${r.messenger_app||''}</div></div>
        </div>
        <div class="cfoot">
          <div class="cdate">📅 ${r.created_at ? new Date(r.created_at).toLocaleDateString('ru-RU',{day:'numeric',month:'long'}) : ''}</div>
          <div class="cbtns"><button class="btn-call" onclick="showPhone(this)">📞 Belgini görkez</button></div>
        </div>
      </div>`);
  });
  updateTabCounts();
  applyFilters();
}


document.addEventListener('DOMContentLoaded', () => {
  setLang('tm');
  updatePhotoCounter();
  initListings();
}); 

const MAX_PHOTOS = 6;
let photoDataUrls = [];

function updatePhotoCounter() {
  const counter = document.getElementById('photo-count');
  if (counter) counter.textContent = `${photoDataUrls.length}/${MAX_PHOTOS} surat`;
}

function renderPhotoPreview() {
  const grid = document.getElementById('photo-preview');
  grid.innerHTML = '';

  photoDataUrls.forEach((url, i) => {
    const thumb = document.createElement('div');
    thumb.className = 'photo-thumb';
    thumb.innerHTML = `<img src="${url}"><button class="photo-thumb-del" type="button" onclick="removePhoto(${i})">×</button>`;
    grid.appendChild(thumb);
  });

  updatePhotoCounter();
}

function previewPhotos(input) {
  const files = Array.from(input.files);

  if (!files.length) return;

  const remaining = MAX_PHOTOS - photoDataUrls.length;
  if (remaining <= 0) {
    alert(`Diňe ${MAX_PHOTOS} surat goşup bolýar`);
    input.value = '';
    return;
  }

  const filesToAdd = files.slice(0, remaining);

  if (files.length > remaining) {
    alert(`Diňe ${MAX_PHOTOS} surat goşup bolýar`);
  }

  let loaded = 0;
  filesToAdd.forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      photoDataUrls.push(e.target.result);
      loaded++;
      if (loaded === filesToAdd.length) renderPhotoPreview();
    };
    reader.readAsDataURL(file);
  });

  input.value = '';
}

function removePhoto(i) {
  photoDataUrls.splice(i, 1);
  renderPhotoPreview();
}

</script>
