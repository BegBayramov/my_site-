<!DOCTYPE html>
<html lang="tk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Bildiriş — GurbatTM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --gd: #0a3d2e; --gm: #1a6b4a; --gp: #e1f5ee; --gm2: #c8e8dc;
    --gold: #c8a84b; --gold-l: #fdf3dc;
    --cream: #faf8f3; --white: #fff;
    --t: #111d17; --t2: #4a6358; --t3: #8aa89a;
    --b: #e2ece7; --sh: rgba(26,107,74,0.07);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'IBM Plex Sans', sans-serif; background: var(--cream); color: var(--t); }

  nav {
    position: sticky; top: 0; z-index: 200;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 48px; height: 64px;
    background: rgba(10,61,46,0.97); backdrop-filter: blur(12px);
    border-bottom: 1px solid rgba(200,168,75,0.2);
  }
  .nav-logo { font-family: 'Playfair Display', serif; font-size: 22px; font-weight: 700; color: #fff; text-decoration: none; }
  .nav-logo span { color: var(--gold); }

  .ph { background: var(--gd); padding: 32px 48px 18px; }
  .ph-inner { max-width: 1100px; margin: 0 auto; }
  .bc { display: flex; gap: 8px; font-size: 12px; color: rgba(255,255,255,0.4); margin-bottom: 14px; flex-wrap: wrap; }
  .bc a { color: rgba(255,255,255,0.55); text-decoration: none; }
  .bc a:hover { color: var(--gold); }
  .ph-title { font-family: 'Playfair Display', serif; font-size: 34px; font-weight: 700; color: #fff; margin-bottom: 4px; }
  .ph-title em { color: var(--gold); font-style: normal; }
  .ph-sub { font-size: 13px; color: rgba(255,255,255,0.5); }

  .main {
    max-width: 1100px; margin: 0 auto; padding: 28px 48px 90px;
    display: grid; grid-template-columns: 1fr 320px; gap: 24px; align-items: start;
  }
  .card { background: #fff; border: 1px solid var(--b); border-radius: 18px; overflow: hidden; box-shadow: 0 8px 32px var(--sh); }

  /* Gallery */
  .gallery { padding: 14px; }
  .gallery.no-photos { display: none; }
  .photo-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .photo-grid.one   { grid-template-columns: 1fr; }
  .photo-grid.two   { grid-template-columns: 1fr 1fr; }
  .photo-grid img {
    width: 100%; aspect-ratio: 4/3; object-fit: cover;
    border-radius: 10px; cursor: pointer;
    transition: opacity .15s, transform .15s;
    display: block;
  }
  .photo-grid img:hover { opacity: .88; transform: scale(1.01); }

  /* Lightbox */
  .lb { display: none; position: fixed; inset: 0; z-index: 800; background: rgba(0,0,0,0.92); align-items: center; justify-content: center; }
  .lb.open { display: flex; }
  .lb-img { max-width: 90vw; max-height: 88vh; border-radius: 12px; object-fit: contain; display: block; }
  .lb-close { position: absolute; top: 16px; right: 20px; background: rgba(255,255,255,0.12); border: none; color: #fff; font-size: 24px; width: 40px; height: 40px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .lb-prev, .lb-next { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.12); border: none; color: #fff; font-size: 22px; width: 44px; height: 44px; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .lb-prev { left: 16px; } .lb-next { right: 16px; }
  .lb-prev:hover, .lb-next:hover, .lb-close:hover { background: rgba(255,255,255,0.25); }
  .lb-counter { position: absolute; bottom: 18px; left: 50%; transform: translateX(-50%); color: rgba(255,255,255,0.6); font-size: 13px; }

  /* Description */
  .desc-card { margin-top: 18px; padding: 22px; }
  .section-title { font-size: 11px; font-weight: 700; letter-spacing: .1em; text-transform: uppercase; color: var(--t3); margin-bottom: 10px; }
  .desc-text { font-size: 15px; line-height: 1.75; color: var(--t2); }

  /* Sidebar */
  .sidebar { position: sticky; top: 82px; display: flex; flex-direction: column; gap: 14px; }
  .info-card { padding: 22px; }
  .badge { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; padding: 5px 10px; border-radius: 999px; background: var(--gp); color: var(--gm); font-weight: 600; margin-bottom: 12px; }
  .title { font-family: 'Playfair Display', serif; font-size: 32px; line-height: 1.2; color: var(--t); margin-bottom: 10px; }
  .price { font-size: 34px; font-weight: 800; color: var(--gd); margin-bottom: 12px; }
  .price:empty { display: none; }
  .meta { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; }
  .meta-chip { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; color: var(--t2); background: #f7faf8; border: 1px solid var(--b); padding: 7px 10px; border-radius: 999px; }

  /* Buttons */
  .contact-btn { width: 100%; padding: 14px 16px; border-radius: 10px; border: none; background: var(--gm); color: #fff; font-size: 15px; font-weight: 700; cursor: pointer; font-family: inherit; transition: background .2s; }
  .contact-btn:hover { background: var(--gd); }
  .secondary-btn { width: 100%; padding: 12px 16px; border-radius: 10px; margin-top: 10px; border: 1px solid var(--b); background: #fff; color: var(--t); font-size: 14px; font-weight: 600; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 8px; transition: all .2s; }
  .secondary-btn:hover { background: var(--gp); border-color: var(--gm2); }
  .secondary-btn.revealed { background: var(--gold-l); border-color: var(--gold); color: var(--gd); font-size: 15px; font-weight: 700; letter-spacing: 0.03em; }

  /* Inline copy */
  .inline-copy { display: flex; align-items: center; justify-content: space-between; background: var(--gold-l); border: 1px solid #e8d48a; border-radius: 10px; padding: 9px 12px; margin-top: 8px; opacity: 0; transform: translateY(-6px); transition: opacity .2s, transform .2s; }
  .inline-copy.visible { opacity: 1; transform: translateY(0); }
  .ic-label { font-size: 13px; color: var(--t2); font-weight: 500; }
  .ic-btn { background: var(--gm); color: #fff; border: none; border-radius: 7px; padding: 5px 12px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .ic-btn.done { background: #2e7d52; }

  /* Seller card */
  .seller-card { padding: 18px 20px; }
  .seller-top { display: flex; gap: 12px; align-items: center; }
  .avatar { width: 52px; height: 52px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--gp); color: var(--gm); font-weight: 700; font-size: 18px; flex-shrink: 0; }
  .seller-name { font-size: 15px; font-weight: 700; color: var(--t); }
  .seller-sub { font-size: 12px; color: var(--t3); margin-top: 2px; }

  /* Share button */
  .share-btn { width: 100%; padding: 10px 16px; border-radius: 10px; margin-top: 10px; border: 1px solid var(--b); background: #fff; color: var(--t2); font-size: 13px; font-weight: 600; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; gap: 6px; transition: all .2s; }
  .share-btn:hover { background: var(--gp); border-color: var(--gm2); }

  .back-link { display: inline-flex; align-items: center; gap: 8px; color: var(--gm); text-decoration: none; font-weight: 600; font-size: 14px; margin-bottom: 14px; }

  /* MODAL */
  .modal-overlay { position: fixed; inset: 0; z-index: 500; background: rgba(10,30,20,0.55); backdrop-filter: blur(6px); display: none; align-items: center; justify-content: center; }
  .modal-overlay.open { display: flex; }
  .modal { background: #fff; border-radius: 22px; padding: 30px 28px 24px; width: 100%; max-width: 360px; box-shadow: 0 24px 64px rgba(10,61,46,0.22); position: relative; animation: modalIn .28s cubic-bezier(.34,1.4,.64,1); }
  @keyframes modalIn { from { transform: translateY(20px) scale(0.96); opacity:0; } to { transform:translateY(0) scale(1); opacity:1; } }
  .modal-close { position: absolute; top: 14px; right: 16px; background: none; border: none; cursor: pointer; font-size: 20px; color: var(--t3); padding: 4px 8px; border-radius: 6px; }
  .modal-close:hover { background: var(--gp); }
  .modal-title { font-family: 'Playfair Display', serif; font-size: 20px; font-weight: 700; color: var(--t); margin-bottom: 4px; }
  .modal-sub { font-size: 13px; color: var(--t3); margin-bottom: 20px; }
  .modal-phone { display: flex; align-items: center; justify-content: space-between; background: var(--gp); border: 1px solid var(--gm2); border-radius: 12px; padding: 12px 16px; margin-bottom: 16px; }
  .modal-phone-number { font-size: 20px; font-weight: 700; color: var(--gd); letter-spacing: .04em; }
  .copy-btn { background: var(--gm); color: #fff; border: none; border-radius: 8px; padding: 6px 12px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .copy-btn.copied { background: #2e7d52; }
  .modal-divider { display: flex; align-items: center; gap: 10px; font-size: 12px; color: var(--t3); margin-bottom: 16px; }
  .modal-divider::before, .modal-divider::after { content:''; flex:1; height:1px; background:var(--b); }
  .messenger-btns { display: flex; flex-direction: column; gap: 10px; }
  .msg-btn { display: flex; align-items: center; gap: 12px; padding: 13px 16px; border-radius: 12px; border: 1px solid var(--b); text-decoration: none; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; background: #fff; color: var(--t); transition: all .18s; }
  .msg-btn:hover { transform: translateX(3px); background: var(--gp); border-color: var(--gm2); }
  .msg-btn-icon { width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .msg-btn-icon svg { width: 20px; height: 20px; fill: #fff; }
  .msg-btn-label { flex: 1; }
  .msg-btn-name { display: block; font-size: 14px; font-weight: 600; }
  .msg-btn-hint { display: block; font-size: 11px; color: var(--t3); }
  .msg-btn-arrow { color: var(--t3); }

  /* Mobile bar */
  .mobile-bar { display: none; }

  @media (max-width: 860px) {
    nav { padding: 0 16px; }
    .ph { padding: 24px 20px 16px; }
    .main { grid-template-columns: 1fr; padding: 22px 20px 100px; }
    .sidebar { position: static; }
    .ph-title { font-size: 28px; }
    .title { font-size: 27px; }
    .price { font-size: 30px; }

    .sidebar-btns { display: none; }
    .mobile-bar {
      display: flex; position: fixed; left: 0; right: 0; bottom: 0; z-index: 300;
      padding: 10px 12px 14px; background: rgba(255,255,255,0.97);
      backdrop-filter: blur(10px); border-top: 1px solid var(--b);
      gap: 10px; box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
    }
    .mobile-bar .contact-btn { flex: 1; padding: 14px 10px; }
    .mobile-bar .secondary-btn { flex: 1; margin-top: 0; padding: 13px 10px; }
    .modal { position: fixed; bottom: 0; left: 0; right: 0; border-radius: 22px 22px 0 0; max-width: 100%; max-height: 90vh; overflow-y: auto; animation: slideUp .3s cubic-bezier(.34,1.2,.64,1); }
    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
  }
  @media (max-width: 560px) {
    .photo-grid { grid-template-columns: repeat(2, 1fr) !important; }
  }
</style>
</head>
<body>

<nav>
  <a href="index.html" class="nav-logo">Gurbat<span>TM</span></a>
</nav>

<header class="ph">
  <div class="ph-inner">
    <div class="bc">
      <a href="index.html">Baş sahypa</a>
      <span>/</span>
      <a href="index.html">Bildirişler</a>
      <span>/</span>
      <span id="bc-title">...</span>
    </div>
    <h1 class="ph-title">Bildiriş <em>maglumaty</em></h1>
    <div class="ph-sub" id="ph-sub"></div>
  </div>
</header>

<main class="main">
  <section>
    <a href="index.html" class="back-link">← Bildirişlere dolan</a>

    <div class="card gallery" id="galleryCard">
      <div class="photo-grid" id="photoGrid"></div>
    </div>

    <!-- Lightbox -->
    <div class="lb" id="lb">
      <button class="lb-close" id="lbClose">✕</button>
      <button class="lb-prev" id="lbPrev">‹</button>
      <img class="lb-img" id="lbImg" src="" alt="">
      <button class="lb-next" id="lbNext">›</button>
      <div class="lb-counter" id="lbCounter"></div>
    </div>

    <div class="card desc-card">
      <div class="section-title">Düşündiriş</div>
      <div class="desc-text" id="adDesc">...</div>
    </div>
  </section>

  <aside class="sidebar">
    <div class="card info-card">
      <div class="badge" id="adBadge">📦 Bildiriş</div>
      <h2 class="title" id="adTitle">...</h2>
      <div class="price" id="adPrice"></div>
      <div class="meta" id="adMeta"></div>

      <div class="sidebar-btns">
        <button class="contact-btn" id="contactBtnDesktop">💬 Habarlaşmak</button>
        <button class="secondary-btn" id="callBtnDesktop">
          <span id="callBtnTextDesktop">📞 Jaň etmek</span>
        </button>
      </div>
      <button class="share-btn" id="shareBtn">🔗 Paýlaşmak</button>
    </div>

    <div class="card seller-card">
      <div class="section-title">Satyjy</div>
      <div class="seller-top">
        <div class="avatar" id="sellerAvatar">?</div>
        <div>
          <div class="seller-name" id="sellerName">...</div>
          <div class="seller-sub">GurbatTM</div>
        </div>
      </div>
    </div>
  </aside>
</main>

<!-- Mobile bottom bar -->
<div class="mobile-bar">
  <button class="secondary-btn" id="callBtnMobile">
    <span id="callBtnTextMobile">📞 Jaň etmek</span>
  </button>
  <button class="contact-btn" id="contactBtnMobile">💬 Habarlaşmak</button>
</div>

<!-- MODAL -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal">
    <button class="modal-close" id="modalClose">✕</button>
    <div class="modal-title" id="modalTitle">Satyjy bilen habarlaş</div>
    <div class="modal-sub" id="modalSub"></div>
    <div class="modal-phone">
      <div class="modal-phone-number" id="modalPhone"></div>
      <button class="copy-btn" id="copyBtn">Göçür</button>
    </div>
    <div class="modal-divider" id="modalDivider">ýa-da messenjer arkaly</div>
    <div class="messenger-btns" id="messengerBtns"></div>
  </div>
</div>

<script>
// ── ICONS ──────────────────────────────────────────────────────
const ICONS = {
  whatsapp: `<svg viewBox="0 0 24 24"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>`,
  telegram: `<svg viewBox="0 0 24 24"><path d="M11.944 0A12 12 0 0 0 0 12a12 12 0 0 0 12 12 12 12 0 0 0 12-12A12 12 0 0 0 12 0a12 12 0 0 0-.056 0zm4.962 7.224c.1-.002.321.023.465.14a.506.506 0 0 1 .171.325c.016.093.036.306.02.472-.18 1.898-.962 6.502-1.36 8.627-.168.9-.499 1.201-.82 1.23-.696.065-1.225-.46-1.9-.902-1.056-.693-1.653-1.124-2.678-1.8-1.185-.78-.417-1.21.258-1.91.177-.184 3.247-2.977 3.307-3.23.007-.032.014-.15-.056-.212s-.174-.041-.249-.024c-.106.024-1.793 1.14-5.061 3.345-.48.33-.913.49-1.302.48-.428-.008-1.252-.241-1.865-.44-.752-.245-1.349-.374-1.297-.789.027-.216.325-.437.893-.663 3.498-1.524 5.83-2.529 6.998-3.014 3.332-1.386 4.025-1.627 4.476-1.635z"/></svg>`,
  viber:    `<svg viewBox="0 0 24 24"><path d="M11.4 0C6.37.017 2.076 2.22.688 6.01-.3 8.684-.045 12.47 1.65 15.07l.058.094-.87 3.82 3.916-.857.093.053c2.463 1.396 5.48 1.684 7.88.759 3.394-1.289 5.618-4.876 5.53-8.85C18.14 5.37 15.265.982 11.4 0m.093 1.736c3.135.66 5.55 4.388 5.625 7.853.074 3.34-1.786 6.378-4.577 7.448-2 .758-4.56.498-6.726-.68l-.347-.2-2.617.573.585-2.568-.208-.32C2.06 12.186 1.82 9 2.66 6.713c1.16-3.185 4.69-4.99 8.833-4.977M8.29 4.677c-.273-.012-.546.063-.75.245-.452.4-.982 1.07-1.13 1.827-.208 1.057.16 2.356 1.12 3.7 1.003 1.406 3.152 3.56 5.72 4.437 1.11.376 2.017.233 2.762-.185.568-.318 1.01-.878 1.128-1.458a.41.41 0 0 0-.208-.43c-.64-.363-1.34-.684-1.987-1.035-.298-.162-.596-.04-.797.162-.256.262-.51.527-.754.8-.142.164-.32.195-.51.12-.92-.37-2.568-1.674-3.32-3.327-.09-.202-.066-.388.086-.54.263-.262.548-.516.787-.797.192-.226.22-.548.063-.82-.32-.555-.63-1.117-.96-1.665a.633.633 0 0 0-.25-.034"/></svg>`,
  imo:      `<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><text x="12" y="16" text-anchor="middle" font-size="8" font-weight="700" fill="white" font-family="Arial">IMO</text></svg>`,
};

// ── READ URL PARAMS ────────────────────────────────────────────
const params = new URLSearchParams(location.search);
const PHONE   = params.get('phone')  || '';
const TITLE   = params.get('title')  || 'Bildiriş';
const DESC    = params.get('desc')   || '';
const PRICE   = params.get('price')  || '';
const CITY    = params.get('city')   || '';
const SELLER  = params.get('seller') || '';
const FLAG    = params.get('flag')   || '';
const CATICON = params.get('caticon')|| '📦';
const CAT     = params.get('cat')    || '';

let MSGS = [];
try { MSGS = JSON.parse(decodeURIComponent(params.get('msgs') || '[]')); } catch(e) {}

let PHOTOS = [];
try { PHOTOS = JSON.parse(decodeURIComponent(params.get('photos') || '[]')); } catch(e) {}

// ── POPULATE PAGE ─────────────────────────────────────────────
document.title = TITLE + ' — GurbatTM';
document.getElementById('bc-title').textContent   = TITLE;
document.getElementById('ph-sub').textContent     = SELLER ? (SELLER + ' · ' + (CITY || '')) : (CITY || '');
document.getElementById('adTitle').textContent    = TITLE;
document.getElementById('adDesc').textContent     = DESC;
document.getElementById('adBadge').textContent    = CATICON + ' Bildiriş';
document.getElementById('sellerName').textContent = SELLER;
document.getElementById('sellerAvatar').textContent = SELLER ? SELLER.charAt(0).toUpperCase() : '?';
document.getElementById('modalTitle').textContent = SELLER || 'Satyjy bilen habarlaş';
document.getElementById('modalSub').textContent   = TITLE;
document.getElementById('modalPhone').textContent = PHONE;

if (PRICE) document.getElementById('adPrice').textContent = PRICE;

const meta = document.getElementById('adMeta');
if (CITY)  meta.innerHTML += `<div class="meta-chip">${FLAG} ${CITY}</div>`;
if (CATICON && CAT) meta.innerHTML += `<div class="meta-chip">${CATICON} ${CAT}</div>`;

// ── PHOTOS + LIGHTBOX ─────────────────────────────────────────
const photoGrid = document.getElementById('photoGrid');
const galleryCard = document.getElementById('galleryCard');

if (PHOTOS.length === 0) {
  galleryCard.classList.add('no-photos');
} else {
  if (PHOTOS.length === 1) photoGrid.classList.add('one');
  else if (PHOTOS.length === 2) photoGrid.classList.add('two');

  PHOTOS.forEach((url, i) => {
    const img = document.createElement('img');
    img.src = url;
    img.alt = 'surat ' + (i + 1);
    img.addEventListener('click', () => openLb(i));
    photoGrid.appendChild(img);
  });
}

// Lightbox
let lbIdx = 0;
const lb       = document.getElementById('lb');
const lbImg    = document.getElementById('lbImg');
const lbCounter= document.getElementById('lbCounter');

function openLb(i) {
  lbIdx = i;
  lbImg.src = PHOTOS[lbIdx];
  lbCounter.textContent = PHOTOS.length > 1 ? (lbIdx + 1) + ' / ' + PHOTOS.length : '';
  lb.classList.add('open');
  document.body.style.overflow = 'hidden';
}
function closeLb() { lb.classList.remove('open'); document.body.style.overflow = ''; }
function lbGo(dir) {
  lbIdx = (lbIdx + dir + PHOTOS.length) % PHOTOS.length;
  lbImg.src = PHOTOS[lbIdx];
  lbCounter.textContent = (lbIdx + 1) + ' / ' + PHOTOS.length;
}

document.getElementById('lbClose').addEventListener('click', closeLb);
document.getElementById('lbPrev').addEventListener('click', () => lbGo(-1));
document.getElementById('lbNext').addEventListener('click', () => lbGo(1));
lb.addEventListener('click', e => { if (e.target === lb) closeLb(); });
document.addEventListener('keydown', e => {
  if (!lb.classList.contains('open')) return;
  if (e.key === 'Escape') closeLb();
  if (e.key === 'ArrowLeft') lbGo(-1);
  if (e.key === 'ArrowRight') lbGo(1);
});

// Hide prev/next if single photo
if (PHOTOS.length <= 1) {
  document.getElementById('lbPrev').style.display = 'none';
  document.getElementById('lbNext').style.display = 'none';
}

// ── MESSENGER BUTTONS IN MODAL ────────────────────────────────
const messengerBtns = document.getElementById('messengerBtns');
const modalDivider  = document.getElementById('modalDivider');

if (MSGS.length === 0) {
  modalDivider.style.display = 'none';
} else {
  MSGS.forEach(m => {
    const a = document.createElement('a');
    a.href = m.url || '#';
    if (m.url) a.target = '_blank';
    a.className = 'msg-btn';
    a.innerHTML = `
      <span class="msg-btn-icon" style="background:${m.color || '#1a6b4a'}">${ICONS[m.id] || ICONS[m.label?.toLowerCase()] || ''}</span>
      <span class="msg-btn-label">
        <span class="msg-btn-name">${m.label || m.name || ''}</span>
        <span class="msg-btn-hint">${m.value || ''}</span>
      </span>
      <span class="msg-btn-arrow">→</span>
    `;
    messengerBtns.appendChild(a);
  });
}

// ── CALL BUTTON ───────────────────────────────────────────────
function makeCallBtn(btn, textEl) {
  if (!btn) return;
  btn.addEventListener('click', () => {
    if (!btn.classList.contains('revealed')) {
      textEl.textContent = '📞 ' + PHONE;
      btn.classList.add('revealed');
      const existing = btn.parentNode.querySelector('.inline-copy');
      if (!existing) {
        const row = document.createElement('div');
        row.className = 'inline-copy';
        row.innerHTML = `<span class="ic-label">Nomer göçür:</span><button class="ic-btn">📋 Göçür</button>`;
        btn.insertAdjacentElement('afterend', row);
        requestAnimationFrame(() => row.classList.add('visible'));
        row.querySelector('.ic-btn').addEventListener('click', e => {
          e.stopPropagation();
          navigator.clipboard.writeText(PHONE).catch(() => {});
          const ib = row.querySelector('.ic-btn');
          ib.textContent = '✓ Göçürildi!'; ib.classList.add('done');
          setTimeout(() => { ib.textContent = '📋 Göçür'; ib.classList.remove('done'); }, 2000);
        });
      }
    }
  });
}
makeCallBtn(document.getElementById('callBtnDesktop'), document.getElementById('callBtnTextDesktop'));
makeCallBtn(document.getElementById('callBtnMobile'),  document.getElementById('callBtnTextMobile'));

// ── CONTACT MODAL ─────────────────────────────────────────────
const overlay = document.getElementById('modalOverlay');
function openModal() { overlay.classList.add('open'); document.body.style.overflow = 'hidden'; }
function closeModal() { overlay.classList.remove('open'); document.body.style.overflow = ''; }

document.getElementById('contactBtnDesktop').addEventListener('click', openModal);
document.getElementById('contactBtnMobile').addEventListener('click', openModal);
document.getElementById('modalClose').addEventListener('click', closeModal);
overlay.addEventListener('click', e => { if (e.target === overlay) closeModal(); });
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeModal(); });

// Copy phone in modal
document.getElementById('copyBtn').addEventListener('click', function() {
  navigator.clipboard.writeText(PHONE).catch(() => {});
  this.textContent = '✓ Göçürildi'; this.classList.add('copied');
  setTimeout(() => { this.textContent = 'Göçür'; this.classList.remove('copied'); }, 2000);
});

// ── SHARE ─────────────────────────────────────────────────────
document.getElementById('shareBtn').addEventListener('click', () => {
  if (navigator.share) {
    navigator.share({ title: TITLE, text: SELLER + ' · ' + TITLE, url: location.href });
  } else {
    navigator.clipboard.writeText(location.href).catch(() => {});
    const btn = document.getElementById('shareBtn');
    btn.textContent = '✓ Salgy göçürildi!';
    setTimeout(() => { btn.innerHTML = '🔗 Paýlaşmak'; }, 2000);
  }
});
</script>
